name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            test
          scopes: |
            spec
            schema
            skill
            docs
            examples
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 'Start the subject with a lower-case letter, for example "docs: explain guided rings".'
