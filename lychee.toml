# Link check for the Markdown files. Relative links are checked against the repository.
exclude_path = ["node_modules", "LICENSES"]
exclude = [
  "^https://github.com/tellscript-dev/tellscript/(issues/new|discussions)",
  "^https://www.linkedin.com/",
]
accept = ["200..=299", "403", "429"]
max_retries = 3
